<!DOCTYPE html>
<html lang="id">
<head>

<title>KEP X Scanner</title>

<style>

body{

}

button{

padding:15px 30px;
font-size:20px;

}

<body>

<h1>KEP X Scanner</h1>

<button onclick="tesAPI()">

Belum ada hasil

</div>

<script>

async function tesAPI(){

const url="https://script.google.com/macros/s/AKfycbwvs041UChld2gLXYH48MpTglRPOaBeIA1l9ew_UB2HcOyhjnBa9-iNTO_xdGL_pe-SAA/exec?action=cari&id=KEPX001";

const data=await res.json();

document.getElementById("hasil").innerHTML=

JSON.stringify(data,null,2);

}

</script>
