<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KEP X Scanner</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    color:#1565C0;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#1565C0;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#0D47A1;
}

#video{
    width:100%;
    max-width:420px;
    margin-top:20px;
    border-radius:12px;
    border:3px solid #1565C0;
}

#hasil{
    margin-top:20px;
    padding:15px;
    background:#fff;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<h1>KEP X Scanner</h1>

<button onclick="startCamera()">
📷 Aktifkan Kamera
</button>

<br><br>

<video id="video" autoplay playsinline></video>

<div id="hasil">
Tekan tombol untuk membuka kamera.
</div>

<script>

let codeReader;

async function startCamera(){

    const hasil = document.getElementById("hasil");
    const video = document.getElementById("video");

    hasil.innerHTML = "📷 Membuka kamera...";

    codeReader = new ZXing.BrowserMultiFormatReader();

    try{

        const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();

        if(devices.length===0){

            hasil.innerHTML="❌ Kamera tidak ditemukan";
            return;

        }

        const selectedDeviceId = devices[0].deviceId;

        codeReader.decodeFromVideoDevice(
            selectedDeviceId,
            video,
            (result,err)=>{

                if(result){

                    hasil.innerHTML=
                    "<h2>✅ QR Berhasil Dibaca</h2>"
                    +"<br>"
                    +result.text;

                    codeReader.reset();

                }

            }
        );

    }

    catch(e){

        hasil.innerHTML="❌ "+e;

    }

}

</script>
</script>

</body>
</html>
